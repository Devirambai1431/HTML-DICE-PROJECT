<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice Roller</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    
      background-image:url(dicees.webp);
      background-repeat: no-repeat;
      background-size: cover;
    }

    .container {
      width: 90%;
      max-width: 450px;
      text-align: center;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
      color: #333;
      margin-bottom: 25px;
    }


    .dice {
      width: 150px;
      height: 150px;
      margin: 20px auto;
      background: #1d1818;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 90px;
      color: white;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s;
    }

    .dice.roll {
      animation: roll 0.5s ease;
    }

    @keyframes roll {
      0% {
        transform: rotate(0deg) scale(1);
      }
      50% {
        transform: rotate(180deg) scale(1.15);
      }
      100% {
        transform: rotate(360deg) scale(1);
      }
    }

    button {
      border: none;
      padding: 14px 30px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #111420;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #0b0c13;
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.95);
    }

    .result {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      color: #333;
    }

    .history {
      margin-top: 20px;
      color: #666;
      font-size: 15px;
    }

    #historyList {
      margin-top: 8px;
      word-wrap: break-word;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🎲 Dice Roller</h1>

    <div class="dice" id="dice">⚀</div>

    <button onclick="rollDice()">Roll Dice</button>

    <div class="result" id="result">
      Roll the dice!
    </div>

    <div class="history">
      <strong>Roll History:</strong>
      <div id="historyList">No rolls yet</div>
    </div>
  </div>

  <script>
    const diceFaces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

    let history = [];

    function rollDice() {
      const dice = document.getElementById("dice");
      const result = document.getElementById("result");
      const historyList = document.getElementById("historyList");

      // Generate random number from 1 to 6
      const number = Math.floor(Math.random() * 6) + 1;

      // Restart animation
      dice.classList.remove("roll");
      void dice.offsetWidth;
      dice.classList.add("roll");

      // Show dice face
      dice.textContent = diceFaces[number - 1];

      // Show result
      result.textContent = `You rolled: ${number}`;

      // Add to history
      history.push(number);

      // Keep only last 10 rolls
      if (history.length > 10) {
        history.shift();
      }

      historyList.textContent = history.join("  •  ");
    }
  </script>

</body>
</html>
